<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามปัญหาระหว่างผลิต | KIM PAI PRINTING & PACKAGING</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js & DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'Sarabun', 'sans-serif'] },
                    colors: {
                        roseLuxury: { 50: '#FDF8F9', 100: '#FCE7F3', 200: '#FBCFE8', 300: '#F9A8D4', 400: '#F472B6', 500: '#EC4899', 600: '#DB2777', 700: '#BE185D', 800: '#9D174D', 900: '#831843' },
                        goldChampagne: { 50: '#FFFBEB', 100: '#FEF3C7', 200: '#FDE68A', 300: '#FCD34D', 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309' }
                    }
                }
            }
        }

        // ==========================================
        // ย้ายฟังก์ชันทั้งหมดมาไว้ที่ <head> เพื่อป้องกัน Error Not Defined
        // ==========================================
        const STORAGE_KEY_URL = 'kimpai_sheets_webapp_url';
        let WEB_APP_URL = localStorage.getItem(STORAGE_KEY_URL) || '';

        const MOCK_DATA = [
            { rowIndex: 2, date: '2026-11-16', shift: 'กะ A', dept: 'พิมพ์สี', machine: '2101', jobNo: 'JOB-2611-088', customerJob: 'บ.ออร่าสกิน - กล่องเซรั่มทอง', defect: 'สีเพี้ยนจากค่ามาตรฐาน', qtySheets: 320, qtyPieces: 0, status: 'แก้ไขแล้ว/ปิดงาน', operator: 'สมชาย', reporter: 'วิภา (QC)', causeAction: 'ปรับค่าหมึก Cyan และล้างผ้ายาง' },
            { rowIndex: 3, date: '2026-11-16', shift: 'กะ B', dept: 'ปั๊ม', machine: '4102', jobNo: 'JOB-2611-092', customerJob: 'บ.สยามฟู้ด - กล่องขนม', defect: 'ปั๊มไม่ขาด / รอยพับแตก', qtySheets: 180, qtyPieces: 0, status: 'กำลังแก้ไข/คัดแยก', operator: 'มานะ', reporter: 'นภา (QC)', causeAction: 'หนุนแผ่นรองมีดไดคัทใหม่' }
        ];

        let allRecords = [];
        let filteredRecords = [];
        let charts = {};

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            const dateInput = document.getElementById('inpDate');
            if (dateInput) dateInput.valueAsDate = new Date();
            updateConnectionUI();
            fetchSheetData();
        });

        function updateConnectionUI() {
            const badge = document.getElementById('syncModeBadge');
            const setupBtn = document.getElementById('setupSheetsBtn');
            if (!badge || !setupBtn) return;

            if (WEB_APP_URL) {
                badge.className = 'px-2.5 py-0.5 text-[11px] font-semibold tracking-wider uppercase rounded-full bg-emerald-500/25 text-emerald-200 border border-emerald-400/40';
                badge.innerHTML = '🟢 โหมด Google Sheets เรียลไทม์';
                setupBtn.classList.remove('animate-pulse');
            } else {
                badge.className = 'px-2.5 py-0.5 text-[11px] font-semibold tracking-wider uppercase rounded-full bg-amber-500/25 text-amber-200 border border-amber-400/40';
                badge.innerHTML = '🟡 โหมดข้อมูลตัวอย่าง (คลิกตั้งค่าลิงก์ชีต)';
                setupBtn.classList.add('animate-pulse');
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-700 border-emerald-400' : type === 'error' ? 'bg-rose-700 border-rose-400' : 'bg-amber-600 border-amber-300';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl border text-xs font-medium flex items-center gap-2 transition-all duration-300`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function switchTab(tabName) {
            ['dashboard', 'form', 'logs'].forEach(t => {
                const viewEl = document.getElementById(`view-${t}`);
                const tabEl = document.getElementById(`tab-${t}`);
                if (viewEl) viewEl.classList.add('hidden');
                if (tabEl) {
                    tabEl.className = 'tab-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all bg-white/15 text-white hover:bg-white/25 border border-white/20';
                }
            });
            const targetView = document.getElementById(`view-${tabName}`);
            const targetTab = document.getElementById(`tab-${tabName}`);
            if (targetView) targetView.classList.remove('hidden');
            if (targetTab) {
                targetTab.className = 'tab-btn active flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all bg-white text-roseLuxury-800 shadow-md';
            }
        }

        function openSheetsModal() {
            const input = document.getElementById('scriptUrlInput');
            if (input) input.value = WEB_APP_URL || '';
            const modal = document.getElementById('sheetsModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeSheetsModal() {
            const modal = document.getElementById('sheetsModal');
            if (modal) modal.classList.add('hidden');
        }

        function saveScriptUrl() {
            const input = document.getElementById('scriptUrlInput');
            if (!input) return;
            const url = input.value.trim();
            if (url && !url.startsWith('https://script.google.com/')) {
                showToast('กรุณากรอก URL ของ Google Apps Script ให้ถูกต้อง', 'error');
                return;
            }
            WEB_APP_URL = url;
            if (url) {
                localStorage.setItem(STORAGE_KEY_URL, WEB_APP_URL);
                showToast('บันทึกลิงก์เชื่อมต่อสำเร็จ กำลังดึงข้อมูล...', 'success');
            } else {
                localStorage.removeItem(STORAGE_KEY_URL);
                showToast('ล้างลิงก์เรียบร้อย กลับสู่โหมดข้อมูลตัวอย่าง', 'warning');
            }
            updateConnectionUI();
            closeSheetsModal();
            fetchSheetData();
        }

        function clearScriptUrl() {
            const input = document.getElementById('scriptUrlInput');
            if (input) input.value = '';
        }

        function openEditModal(rowIndex) {
            const record = allRecords.find(r => r.rowIndex == rowIndex);
            if (!record) return;

            document.getElementById('editRowIndex').value = record.rowIndex;
            document.getElementById('editDate').value = record.date || '';
            document.getElementById('editShift').value = record.shift || 'กะ A';
            document.getElementById('editDept').value = record.dept || '';
            document.getElementById('editMachine').value = record.machine || '';
            document.getElementById('editJobNo').value = record.jobNo || '';
            document.getElementById('editCustomerJob').value = record.customerJob || '';
            document.getElementById('editDefect').value = record.defect || '';
            document.getElementById('editQtySheets').value = record.qtySheets || 0;
            document.getElementById('editQtyPieces').value = record.qtyPieces || 0;
            document.getElementById('editStatus').value = record.status || 'รอดำเนินการ';
            document.getElementById('editOperator').value = record.operator || '';
            document.getElementById('editReporter').value = record.reporter || '';
            document.getElementById('editCauseAction').value = record.causeAction || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function submitEditRecord() {
            const rowIndex = Number(document.getElementById('editRowIndex').value);
            const updatedPayload = {
                action: 'update',
                rowIndex: rowIndex,
                date: document.getElementById('editDate').value,
                shift: document.getElementById('editShift').value,
                dept: document.getElementById('editDept').value,
                machine: document.getElementById('editMachine').value,
                jobNo: document.getElementById('editJobNo').value.trim(),
                customerJob: document.getElementById('editCustomerJob').value.trim(),
                defect: document.getElementById('editDefect').value.trim(),
                qtySheets: Number(document.getElementById('editQtySheets').value) || 0,
                qtyPieces: Number(document.getElementById('editQtyPieces').value) || 0,
                status: document.getElementById('editStatus').value,
                operator: document.getElementById('editOperator').value.trim(),
                reporter: document.getElementById('editReporter').value.trim(),
                causeAction: document.getElementById('editCauseAction').value.trim()
            };

            try {
                if (WEB_APP_URL) {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedPayload)
                    });
                    showToast('อัปเดตข้อมูลสำเร็จ!', 'success');
                } else {
                    showToast('อัปเดตในโหมดตัวอย่างเรียบร้อย', 'warning');
                }

                const index = allRecords.findIndex(r => r.rowIndex == rowIndex);
                if (index !== -1) {
                    allRecords[index] = { ...updatedPayload };
                }

                closeEditModal();
                applyFilters();
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการอัปเดตข้อมูล', 'error');
            }
        }

        async function deleteRecord(rowIndex) {
            if (!confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) return;

            try {
                if (WEB_APP_URL) {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                    });
                    showToast('ลบรายการสำเร็จ!', 'success');
                } else {
                    showToast('ลบรายการในโหมดตัวอย่างเรียบร้อย', 'warning');
                }

                allRecords = allRecords.filter(r => r.rowIndex != rowIndex);
                applyFilters();
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error');
            }
        }

        async function fetchSheetData() {
            if (!WEB_APP_URL) {
                allRecords = [...MOCK_DATA];
                populateYearFilter();
                applyFilters();
                return;
            }
            try {
                showToast('กำลังซิงค์ข้อมูลจาก Google Sheets...', 'warning');
                const res = await fetch(WEB_APP_URL);
                const result = await res.json();
                const rawList = Array.isArray(result) ? result : (result.data || []);
                allRecords = rawList.map((row, i) => ({
                    rowIndex: row.rowIndex || (i + 2),
                    date: row.date || row['วันที่พบปัญหา'] || '',
                    shift: row.shift || row['กะการทำงาน'] || 'กะ A',
                    dept: row.dept || row['แผนกที่พบปัญหา'] || '-',
                    machine: String(row.machine || row['เครื่องจักร'] || '-'),
                    jobNo: row.jobNo || row['Job No.'] || '-',
                    customerJob: row.customerJob || row['ลูกค้า / ชื่องาน'] || '-',
                    defect: row.defect || row['ปัญหาที่พบ'] || '-',
                    qtySheets: Number(row.qtySheets || row['จำนวนแผ่น'] || 0),
                    qtyPieces: Number(row.qtyPieces || row['จำนวนชิ้น'] || 0),
                    status: row.status || row['สถานะ'] || 'รอดำเนินการ',
                    operator: row.operator || row['ผู้ที่ผลิตงาน'] || '-',
                    reporter: row.reporter || row['ผู้แจ้งข้อมูล'] || '-',
                    causeAction: row.causeAction || row['สาเหตุและการแก้ไข'] || ''
                }));
                populateYearFilter();
                applyFilters();
                showToast(`โหลดข้อมูลสำเร็จ (${allRecords.length} รายการ)`, 'success');
            } catch (err) {
                console.error(err);
                showToast('ไม่สามารถเชื่อมต่อ Google Sheets ได้', 'error');
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalHTML = submitBtn.innerHTML;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>กำลังบันทึก...</span>';
            }

            const payload = {
                action: 'add',
                date: document.getElementById('inpDate').value,
                shift: document.querySelector('input[name="inpShift"]:checked').value,
                dept: document.getElementById('inpDept').value,
                machine: document.getElementById('inpMachine').value,
                jobNo: document.getElementById('inpJobNo').value.trim(),
                customerJob: document.getElementById('inpCustomerJob').value.trim(),
                defect: document.getElementById('inpDefect').value.trim(),
                qtySheets: Number(document.getElementById('inpQtySheets').value) || 0,
                qtyPieces: Number(document.getElementById('inpQtyPieces').value) || 0,
                status: document.getElementById('inpStatus').value,
                operator: document.getElementById('inpOperator').value.trim(),
                reporter: document.getElementById('inpReporter').value.trim(),
                causeAction: document.getElementById('inpCauseAction').value.trim()
            };

            try {
                if (WEB_APP_URL) {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast('บันทึกเข้า Google Sheets เรียบร้อย!', 'success');
                } else {
                    showToast('บันทึกในโหมดตัวอย่างเรียบร้อย', 'warning');
                }
                document.getElementById('defectForm').reset();
                document.getElementById('inpDate').valueAsDate = new Date();
                
                fetchSheetData();
                switchTab('dashboard');
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการบันทึก', 'error');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHTML;
                }
            }
        }

        function populateYearFilter() {
            const yearSelect = document.getElementById('filterYear');
            if (!yearSelect) return;
            const currentVal = yearSelect.value;
            const years = [...new Set(allRecords.map(r => r.date ? r.date.substring(0, 4) : null).filter(Boolean))].sort().reverse();
            yearSelect.innerHTML = '<option value="ALL">ทุกปี</option>' + years.map(y => `<option value="${y}">${Number(y) + 543} (${y})</option>`).join('');
            if (years.includes(currentVal)) yearSelect.value = currentVal;
        }

        function setDatePreset(preset) {
            ['ALL', 'TODAY', 'THIS_MONTH'].forEach(p => {
                const btn = document.getElementById(`preset-${p}`);
                if (btn) {
                    btn.className = p === preset
                        ? 'date-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-roseLuxury-700 text-white shadow-sm transition'
                        : 'date-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-roseLuxury-50 text-roseLuxury-800 hover:bg-roseLuxury-100 border border-roseLuxury-200 transition';
                }
            });
            const today = new Date();
            const yyyy = String(today.getFullYear());
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${String(today.getDate()).padStart(2, '0')}`;

            if (preset === 'ALL') {
                document.getElementById('filterYear').value = 'ALL';
                document.getElementById('filterMonth').value = 'ALL';
                applyFilters();
            } else if (preset === 'THIS_MONTH') {
                document.getElementById('filterYear').value = yyyy;
                document.getElementById('filterMonth').value = mm;
                applyFilters();
            } else if (preset === 'TODAY') {
                document.getElementById('filterYear').value = yyyy;
                document.getElementById('filterMonth').value = mm;
                applyFilters(todayStr);
            }
        }

        function applyFilters(exactDate = null) {
            const fYear = document.getElementById('filterYear').value;
            const fMonth = document.getElementById('filterMonth').value;
            const fDept = document.getElementById('filterDept').value;
            const fShift = document.getElementById('filterShift').value;
            const fStatus = document.getElementById('filterStatus').value;

            filteredRecords = allRecords.filter(r => {
                if (exactDate && r.date !== exactDate) return false;
                if (fYear !== 'ALL' && (!r.date || !r.date.startsWith(fYear))) return false;
                if (fMonth !== 'ALL' && (!r.date || r.date.substring(5, 7) !== fMonth)) return false;
                if (fDept !== 'ALL' && r.dept !== fDept) return false;
                if (fShift !== 'ALL' && r.shift !== fShift) return false;
                if (fStatus !== 'ALL' && r.status !== fStatus) return false;
                return true;
            });

            const totalBadge = document.getElementById('totalBadgeCount');
            if (totalBadge) totalBadge.textContent = filteredRecords.length;
            updateKPIs();
            updateCharts();
            renderLogsTable();
        }

        function updateKPIs() {
            const total = filteredRecords.length;
            const shiftA = filteredRecords.filter(r => r.shift === 'กะ A').length;
            const shiftB = filteredRecords.filter(r => r.shift === 'กะ B').length;
            const totalSheets = filteredRecords.reduce((sum, r) => sum + (r.qtySheets || 0), 0);
            const totalPieces = filteredRecords.reduce((sum, r) => sum + (r.qtyPieces || 0), 0);
            const closedCount = filteredRecords.filter(r => r.status === 'แก้ไขแล้ว/ปิดงาน').length;
            const resolveRate = total > 0 ? Math.round((closedCount / total) * 100) : 0;

            document.getElementById('kpiTotalCases').textContent = total.toLocaleString();
            document.getElementById('kpiShiftA').textContent = shiftA.toLocaleString();
            document.getElementById('kpiShiftB').textContent = shiftB.toLocaleString();
            document.getElementById('kpiTotalSheets').textContent = totalSheets.toLocaleString();
            document.getElementById('kpiTotalPieces').textContent = totalPieces.toLocaleString();
            document.getElementById('kpiResolveRate').textContent = `${resolveRate}%`;
            document.getElementById('kpiClosedCount').textContent = closedCount.toLocaleString();
            document.getElementById('kpiPendingCount').textContent = (total - closedCount).toLocaleString();
        }

        function getTopCounts(key, limit = 7) {
            const map = {};
            filteredRecords.forEach(r => {
                const val = r[key] || 'ไม่ระบุ';
                map[val] = (map[val] || 0) + 1;
            });
            const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, limit);
            return { labels: sorted.map(i => i[0]), values: sorted.map(i => i[1]) };
        }

        function updateCharts() {
            const m = getTopCounts('machine');
            const d = getTopCounts('defect');
            const o = getTopCounts('operator');
            const rep = getTopCounts('reporter');

            renderBarChart('chartMachines', m.labels, m.values, '#BE185D', 'จำนวนเคส');
            renderBarChart('chartDefects', d.labels, d.values, '#D97706', 'จำนวนเคส', true);
            renderBarChart('chartOperators', o.labels, o.values, '#9D174D', 'จำนวนเคส');
            renderBarChart('chartReporters', rep.labels, rep.values, '#B45309', 'จำนวนเคส');
        }

        function renderBarChart(canvasId, labels, data, color, labelName, horizontal = false) {
            if (charts[canvasId]) charts[canvasId].destroy();
            const canvasEl = document.getElementById(canvasId);
            if (!canvasEl) return;
            const ctx = canvasEl.getContext('2d');
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: labelName, data: data, backgroundColor: color, borderRadius: 8, maxBarThickness: 36 }] },
                options: {
                    indexAxis: horizontal ? 'y' : 'x',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        datalabels: { color: '#FFFFFF', font: { family: 'Prompt', weight: 'bold', size: 12 }, formatter: (v) => v > 0 ? v : '' }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { family: 'Prompt', size: 11 } } },
                        y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: 'Prompt', size: 11 } } }
                    }
                }
            });
        }

        function renderLogsTable() {
            const tbody = document.getElementById('fullLogsBody');
            if (!tbody) return;
            const keyword = (document.getElementById('searchLogsInput')?.value || '').toLowerCase();
            const displayList = filteredRecords.filter(r =>
                r.jobNo.toLowerCase().includes(keyword) || r.customerJob.toLowerCase().includes(keyword) ||
                r.defect.toLowerCase().includes(keyword) || r.machine.toLowerCase().includes(keyword) || r.operator.toLowerCase().includes(keyword)
            );

            if (displayList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-gray-400">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</td></tr>`;
                return;
            }

            tbody.innerHTML = displayList.map(r => {
                const statusBadge = r.status === 'แก้ไขแล้ว/ปิดงาน' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' :
                                    r.status === 'กำลังแก้ไข/คัดแยก' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-rose-100 text-rose-800 border-rose-200';
                return `
                    <tr class="hover:bg-roseLuxury-50/60 transition">
                        <td class="py-3 px-4 whitespace-nowrap"><div class="font-semibold text-gray-900">${r.date}</div><span class="text-[11px] px-2 py-0.5 rounded bg-roseLuxury-100 text-roseLuxury-800 font-medium">${r.shift}</span></td>
                        <td class="py-3 px-4 whitespace-nowrap"><div class="font-medium text-gray-800">${r.dept}</div><div class="text-xs text-gray-500">เครื่อง: ${r.machine}</div></td>
                        <td class="py-3 px-4"><div class="font-bold text-roseLuxury-800">${r.jobNo}</div><div class="text-xs text-gray-600">${r.customerJob}</div></td>
                        <td class="py-3 px-4"><div class="font-medium text-gray-900">${r.defect}</div>${r.causeAction ? `<div class="text-xs text-gray-500 mt-0.5">แนวทาง: ${r.causeAction}</div>` : ''}</td>
                        <td class="py-3 px-4 text-right whitespace-nowrap font-bold text-gray-900">
                            ${r.qtySheets > 0 ? `${r.qtySheets.toLocaleString()} แผ่น<br>` : ''} ${r.qtyPieces > 0 ? `${r.qtyPieces.toLocaleString()} ชิ้น` : ''}

                        </td>
                    </tr>
                `;
